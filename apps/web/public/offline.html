<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#365d49" />
    <title>Ngoại tuyến · BrewLite</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
             background: #faf8f3; color: #302a26; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      main { max-width: 22rem; padding: 2rem 1.5rem; text-align: center; }
      .icon { font-size: 3rem; }
      h1 { font-size: 1.25rem; margin: 0.75rem 0 0.25rem; }
      p { color: #6f6a63; font-size: 0.9rem; line-height: 1.5; margin: 0 0 1.25rem; }
      button { min-height: 44px; padding: 0 1.5rem; border: 0; border-radius: 999px; background: #365d49;
               color: #fff; font-weight: 600; font-size: 0.9rem; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <div class="icon" aria-hidden="true">🧋</div>
      <h1>Bạn đang ngoại tuyến</h1>
      <p>BrewLite cần kết nối mạng để tải thực đơn mới nhất. Hãy kiểm tra Wi-Fi/4G rồi thử lại nhé.</p>
      <button type="button" onclick="location.reload()">Thử lại</button>
    </main>
  </body>
</html>
